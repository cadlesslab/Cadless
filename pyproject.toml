[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadless"
version = "1.0.0"
description = "Cadless — natural-language-driven CAD PoC (text to build123d to B-Rep)"
readme = "README.md"
requires-python = ">=3.12"
# Every pin below carries an upper bound. Without one, a release published
# after this tree was written changes what the tree installs — which is not
# hypothetical here: a major SDK release removed a parameter the provider still
# sends and took out every chat turn on the next rebuild, with nothing in the
# tree changed and the suite still green.
#
# The bound is the next major for a package that follows semver, and the next
# minor for a pre-1.0 one, that being its breaking unit. Raising one is then a
# decision taken deliberately rather than a surprise arriving with a rebuild.
# These ranges are the contract a dependent project resolves against;
# constraints.txt pins the single exact resolution the images and CI install.
dependencies = [
    "build123d>=0.10.0,<0.12",
    "boto3>=1.40.0,<2",
    # 1.x removed temperature/top_p/top_k from Messages.create() entirely —
    # they did not move to output_config, so 1.x is a port and not a bump.
    "anthropic>=0.49,<1",
    "openai>=1.40,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pillow>=10.0,<13",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "aiosqlite>=0.20,<1",
    "sse-starlette>=2.1,<4",
    # cadless/worker.py calls out over HTTP from async request handlers.
    # httpx already arrives transitively (both anthropic and openai require it),
    # so this declares what we import rather than pulling in anything new.
    "httpx>=0.27,<1",
]
# The web entries below are repeated verbatim from `web` above; keep the two
# lists identical so a bound raised in one is never missed in the other.
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.6,<0.17",
    # tests/test_sdk_signature_conformance.py parses the specifiers in this file
    # against constraints.txt. packaging already arrives under pip, so this
    # declares what a test imports rather than pulling in anything new.
    "packaging>=24,<27",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "aiosqlite>=0.20,<1",
    "sse-starlette>=2.1,<4",
    "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["cadless"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query() in argument defaults is the idiomatic pattern.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_branding.py reads its scan scope from tools/leak_guard.py, which is
# a standalone script rather than part of the installed package.
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:build123d",
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]
markers = [
    "bedrock: tests that call the live AWS Bedrock API (require credentials)",
    "anthropic: tests that call the live Anthropic API (require ANTHROPIC_API_KEY)",
    "openai: tests that call the live OpenAI API (require OPENAI_API_KEY)",
    "build123d: tests that execute build123d/OCCT geometry",
]
