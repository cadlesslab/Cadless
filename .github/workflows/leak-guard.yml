# Leak guard + DCO + attribution guard for the public repository.
#
# The tree must stay free of internal references and credential shapes
# (tools/leak_guard.py, fail-closed -- this repo used to be produced by a
# scrubbing extractor; direct commits mean the scrub must live here now),
# and so must the text a change is *published* with: a commit message and a
# pull-request body reach the world exactly as a tracked file does, and no
# tree walk can see either. Every pull-request commit must carry a
# Signed-off-by trailer (DCO -- see CONTRIBUTING.md), and no commit message
# or pull-request body may carry AI-assistant attribution
# (tools/attribution_guard.py).
name: leak-guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan the tree
        run: python tools/leak_guard.py

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while read -r sha; do
            if ! git log -1 --format='%(trailers:key=Signed-off-by,only,valueonly)' "$sha" | grep -q .; then
              echo "::error::commit $sha has no Signed-off-by trailer"
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE".."$HEAD")
          if [ "$missing" -ne 0 ]; then
            echo 'Sign your commits with: git commit -s (see CONTRIBUTING.md, "Developer Certificate of Origin")'
            exit 1
          fi
          echo "all commits carry Signed-off-by"

  attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The body is fetched rather than taken from `github.event.pull_request.body`.
      # A re-run replays the original event payload, so a job that failed on a
      # body re-read the text that had already failed and could never pass --
      # correcting the body and re-running was not a recovery, and the only way
      # back was to close and reopen the pull request. Fetching reads what the
      # body says now.
      - name: Collect the text this pull request publishes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git log --no-merges --format='%B' "$BASE".."$HEAD" > messages.txt
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""' > pr_body.txt

      - name: No assistant attribution in commit messages or the PR body
        run: python tools/attribution_guard.py messages.txt pr_body.txt

      # The two inputs are scanned separately, and that is not tidiness: their
      # remedies are opposites. A commit message is rewritten and force-pushed;
      # a body is edited in place and must not be force-pushed at all. One step
      # covering both could only name both, and did.
      - name: No internal references in commit messages
        run: |
          python tools/leak_guard.py --text messages.txt || {
            echo "::error::Reword the commit and force-push before merging."
            exit 1
          }

      - name: No internal references in the pull request body
        run: |
          python tools/leak_guard.py --text pr_body.txt || {
            echo "::error::Edit the body (gh pr edit --body-file). Do not force-push — this text is never in a commit. Editing does not un-publish it: GitHub keeps and serves the earlier revisions, so treat what was already there as disclosed."
            exit 1
          }
