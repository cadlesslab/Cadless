# Release attachments.
#
# Attaches what release-artifacts built — and, for the backend, the file of image
# digests release-images wrote — to the GitHub Release its tag names. An asset
# already attached is left as it is and never replaced, so running this a second
# time only attaches what the first left out.
name: release-attach

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, backend-vX.Y.Z or frontend-vX.Y.Z
        type: string
        required: true

# `bash` named explicitly runs every step with pipefail, so a failed query in a
# pipeline fails its step instead of handing an empty value on.
defaults:
  run:
    shell: bash

jobs:
  attach:
    runs-on: ubuntu-latest
    # Its branch rule keeps a run from any branch but main out of this job. The
    # token's write scope is GitHub's to grant, not the environment's: who may
    # change a release at all is the repository's write role (RUNBOOK).
    environment: release
    permissions:
      contents: write
    steps:
      # Before anything from the repository runs: the input is checked as text.
      - name: The tag is a release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^(backend|frontend)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag"
            exit 1
          fi

      # The tag in full: a bare name would check out a branch of the same name.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit is on main
        run: git merge-base --is-ancestor HEAD origin/main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: The tag names the version its tree carries
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          component="$(python tools/release_artifacts.py check-tag "$TAG")"
          echo "component=$component" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-${{ steps.tag.outputs.component }}*
          merge-multiple: true
          path: dist

      # Exactly the files this tag's release carries, by component and version:
      # files built for another version, or for the other component, stop here.
      - name: The files are the ones this release carries
        env:
          TAG: ${{ inputs.tag }}
        run: python tools/release_artifacts.py verify "$TAG" dist

      # Again over everything about to be attached, the image digests included,
      # which no earlier job scanned.
      - name: No internal references found in what is attached
        run: python tools/release_artifacts.py scan dist

      # A rebuild of the same commit with the same tools is byte for byte the
      # same, so an asset already attached is either these bytes, and skipped,
      # or something else, and the run stops with the asset left as it is.
      - name: Attach what is not attached yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          assets="$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq '.assets[] | "\(.name) \(.digest)"')"
          for file in dist/*; do
            name="$(basename "$file")"
            digest="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            attached="$(awk -v name="$name" '$1 == name { print $2 }' <<< "$assets")"
            if [ -z "$attached" ]; then
              gh release upload "$TAG" "$file" --repo "$REPOSITORY"
            elif [ "$attached" = "$digest" ]; then
              echo "already attached with the same bytes: $name"
            else
              echo "::error::$name is attached with other bytes ($attached); it is left as it is"
              exit 1
            fi
          done
