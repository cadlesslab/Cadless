# Serves the SPA under a subpath. The API is NOT proxied here —
# the bundled Caddy owns the /api/* arm (see infra/proxy/Caddyfile).
#
# The prefix below is the default, not the only value it can take.
# frontend/Dockerfile substitutes BASE_PATH into this file at build time and
# copies the bundle to the matching directory, so the two cannot drift. Write
# any new location in the same trailing-slash form or the substitution skips
# it, leaving a config that serves the old prefix from the new bundle path —
# tests/test_frontend_prefix.py fails on that.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Vite builds with this same prefix as its base, so asset URLs arrive
    # already prefixed and are served straight from disk. The fallback is what
    # lets a client-side route survive a reload.
    location /apps/cadless/ {
        try_files $uri $uri/ /apps/cadless/index.html;
    }
}
